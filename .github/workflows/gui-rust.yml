name: GUI Rust validation

on:
  push:
    branches: [main]
    paths:
      - gui/rust/**
      - gui/original/**
      - .github/workflows/gui-rust.yml
  pull_request:
    paths:
      - gui/rust/**
      - gui/original/**
      - .github/workflows/gui-rust.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-rust-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  window-position:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Get source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.90.0
      - name: Check formatting and lint
        run: |
          cargo fmt --manifest-path gui/rust/Cargo.toml --check
          cargo clippy --manifest-path gui/rust/Cargo.toml --locked --offline --all-targets -- -D warnings
      - name: Test recovered integer contracts
        run: |
          cargo test --manifest-path gui/rust/Cargo.toml --locked --offline
          cargo test --manifest-path gui/rust/Cargo.toml --locked --offline --release

  qt-api:
    # This job uses the distribution Qt version. Local reference checks use 6.11.2.
    # A successful build does not establish original GUI or Windows parity.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      QT_FORCE_STDERR_LOGGING: "1"
      QMAKE: /usr/bin/qmake6
      CARGO_TARGET_DIR: /tmp/gui-qt-target
    steps:
      - name: Get source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.90.0
      - name: Install distribution Qt development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-declarative-dev qt6-5compat-dev \
            qml6-module-qtqml qml6-module-qtqml-models \
            qt6-qpa-plugins qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript qml6-module-qt5compat-graphicaleffects \
            libclang-dev lld
          qmake6 -query QT_VERSION
          ld.lld --version
      - name: Build Rust Qt application source
        run: |
          cargo build --manifest-path gui/rust/qt/Cargo.toml --locked
          cargo build --manifest-path gui/rust/host/Cargo.toml --locked
      - name: Check Rust Qt source
        run: |
          cargo fmt --manifest-path gui/rust/qt/Cargo.toml --check
          cargo fmt --manifest-path gui/rust/host/Cargo.toml --check
          cargo clippy --manifest-path gui/rust/qt/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path gui/rust/host/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test Qt boundary and original resource loading
        run: |
          cargo test --manifest-path gui/rust/qt/Cargo.toml --locked
          cargo test --manifest-path gui/rust/host/Cargo.toml --locked --test qt_runtime
