name: GUI Rust validation

on:
  push:
    branches: [main]
    paths:
      - gui/rust/**
      - .github/workflows/gui-rust.yml
  pull_request:
    paths:
      - gui/rust/**
      - .github/workflows/gui-rust.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-rust-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  window-position:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Get source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.90.0
      - name: Check formatting and lint
        run: |
          cargo fmt --manifest-path gui/rust/Cargo.toml --check
          cargo clippy --manifest-path gui/rust/Cargo.toml --locked --offline --all-targets -- -D warnings
      - name: Test recovered integer contracts
        run: |
          cargo test --manifest-path gui/rust/Cargo.toml --locked --offline
          cargo test --manifest-path gui/rust/Cargo.toml --locked --offline --release
